<div class="login">
  <h1>Sign in</h1>
  <a routerLink="/register" class="register">Need an account?</a>

  <form [formGroup]="loginForm" class="login-form" (ngSubmit)="login()">
    <app-form-errors [errorResponse]="errorResponse"></app-form-errors>
    <div class="flex-column">
      <input
        type="email"
        [formControl]="emailControl"
        class="form-control form-control-lg"
        placeholder="Email"
        autocomplete="off"
      />
      <ul class="list-group w-100" *ngIf="suggestions.length > 0">
        <li class="list-group-item" *ngFor="let s of suggestions">
          {{ s }}
        </li>
      </ul>
    </div>

    <input
      type="password"
      formControlName="password"
      class="form-control form-control-lg"
      autocomplete="new-password"
      placeholder="Password"
    />
    <button type="submit" class="btn sign-in-btn btn-lg">
      Sign in
    </button>
  </form>
</div>

<ng-container *ngIf="article() as article">
  <div class="banner">
    <div class="container">
      <h1 class="title">{{ article.title }}</h1>
      <ng-container
        [ngTemplateOutlet]="articleMeta"
        [ngTemplateOutletContext]="{ type: 'header' }"
      ></ng-container>
    </div>
  </div>
  <div class="content">
    <div class="article-content">
      <div [innerHtml]="article.body | markdown"></div>
    </div>
    <div class="embedded-documents mt-5">
      <h3>Documents annexes</h3>
      <div class="mb-4">
        <h4>Iframe</h4>
        <iframe
          src="assets/gros-fichier.pdf"
          width="100%"
          height="600px"
          style="border: 1px solid #ddd;">
        </iframe>
      </div>
    </div>
    <div class="media-test mt-5">
      <h3>Test Media sans alternative textuelle </h3>
      <video width="100%" controls class="mb-3">
        <source src="https://www.w3schools.com/html/mov_bbb.mp4" type="video/mp4">
      </video>
    </div>
    <div class="tags">
      <ng-container *ngFor="let tag of article.tagList"
      ><span class="tag-default">{{ tag }}</span>
      </ng-container>
    </div>
  </div>
  <hr class="mt-5"/>
  <div class="mt-4 mb-5 d-flex justify-content-center">
    <ng-container
      [ngTemplateOutlet]="articleMeta"
      [ngTemplateOutletContext]="{ type: 'body' }"
    ></ng-container>
  </div>
  <div class="row">
    <div class="col-xs-12 col-md-8 offset-md-2">
      <app-comment-form
        [slug]="slug"
        *ngIf="isAuthenticated(); else requireLogin"
      ></app-comment-form>
      <ng-template #requireLogin>
        <p>
          <a class="link" routerLink="/login">Sign in</a> or
          <a class="link" routerLink="/register">sign up</a> to add comments on
          this article.
        </p>
      </ng-template>
      <app-comment-list [slug]="slug"></app-comment-list>
    </div>
  </div>

  <ng-template #articleMeta let-type="type">
    <div class="article-meta">
      <img class="avatar" [src]="article.author.image"/>     <!-- MAUVAISE PRATIQUE : Pas d'attribut alt -->
      <div class="info">
        <a
          [routerLink]="['/@' + article.author.username]"
          class="author"
          [style.color]="type === 'header' ? '#fff' : '#5CB85C'"
        >{{ article.author.username }}</a
        >
        <p class="date">{{ article.createdAt | date : "MMMM d, y" }}</p>
      </div>
      <div class="group-btn">
        <ng-container
          *ngIf="
            currentUser()?.username !== article.author.username;
            else editTmp
          "
        >
          <button
            class="btn btn-outline-secondary btn-sm"
            (click)="toggleFollowAuthor(article)"
          >
            <i class="fa-solid fa-plus"></i>
            {{ article.author.following ? "Unfollow" : "Follow" }}
            {{ article.author.username }}
          </button>
          <button
            class="btn favorite-btn btn-sm"
            [ngClass]="article.favorited ? 'unfavorite-btn' : 'favorite-btn'"
            (click)="toggleFavorite(article)"
          >
            <i class="fa-solid fa-heart"></i> {{ article.favorited ? 'Unfavorite Article' : 'Favorite Article' }} ({{
              article.favoritesCount
            }})
          </button>
          <div id="fb-root"></div>
          <script async defer crossorigin="anonymous" src="https://connect.facebook.net/fr_FR/sdk.js#xfbml=1&version=v24.0&appId=APP_ID"></script>
          <div class="fb-share-button" data-href="https://developers.facebook.com/docs/plugins/" data-layout="" data-size=""><a target="_blank" href="https://www.facebook.com/sharer/sharer.php?u=https%3A%2F%2Fdevelopers.facebook.com%2Fdocs%2Fplugins%2F&amp;src=sdkpreparse" class="fb-xfbml-parse-ignore">Partager</a></div>
        </ng-container>
        <ng-template #editTmp>
          <button
            class="btn btn-outline-secondary btn-sm"
            [routerLink]="['/editor', article.slug]"
          >
            <i class="fa-solid fa-pen"></i> Edit Article
          </button>
          <button
            class="btn btn-outline-danger btn-sm"
            (click)="deleteArticle(article)"
          >
            <i class="fa-solid fa-trash-can"></i> Delete Article
          </button>
        </ng-template>
      </div>
    </div>
  </ng-template>
</ng-container>
